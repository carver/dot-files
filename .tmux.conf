# tmux config, linked to ~/.tmux.conf by install.sh. Reload a running server with
# `tmux source ~/.tmux.conf`; a fresh server reads it on its own.

# Ctrl-t is the prefix, carried over from the .screenrc this replaced. Ctrl-t twice sends a
# Ctrl-t through to the program in the pane. Ctrl-b goes back to being an ordinary key.
set -g prefix C-t
bind C-t send-prefix
unbind C-b

# Windows are the tabs. Number them from 1, so window N is under key N.
set -g base-index 1
set -g pane-base-index 1

# vi keys in copy mode (prefix [) and at the command prompt (prefix :)
set -g mode-keys vi
set -g status-keys vi

# Closing a window renumbers the ones after it, so there is never a gap in the tabs
set -g renumber-windows on

# Ctrl-PageUp / Ctrl-PageDown move between tabs, no prefix, the same keys GNOME Terminal uses
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

# A new tab (prefix c) starts in the directory the current one is in, as a terminal tab does
bind c new-window -c "#{pane_current_path}"

# Esc reaches nvim after 10ms instead of the 500ms tmux 3.4 waits for an escape sequence
set -s escape-time 10

# True color for nvim, and the terminfo entry that knows what tmux itself supports
set -g default-terminal tmux-256color
set -as terminal-features ",*:RGB"

# Click a tab to switch, wheel to scroll back, drag a pane border to resize
set -g mouse on

# 50000 lines of scrollback per pane, up from 2000
set -g history-limit 50000

# Tabs along the top, where a browser puts them
set -g status-position top

# v puts the new pane beside this one, h below it, as vim's :vsplit and :split do. tmux
# names a split by the direction it cuts, so v is -h and h is -v. Both start in the current
# directory.
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# prefix Ctrl-h/j/k/l move to the pane on the left, below, above, right, the letters vim moves with
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# Alt-1 .. Alt-9 jump to that tab, no prefix. GNOME Terminal wants these keys for its own
# tabs; install.sh turns those shortcuts off.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
