# tmux config, linked to ~/.tmux.conf by install.sh. Reload a running server with
# `tmux source ~/.tmux.conf`; a fresh server reads it on its own.

# Windows are the tabs. Number them from 1, so window N is under key N.
set -g base-index 1
set -g pane-base-index 1

# vi keys in copy mode (prefix [) and at the command prompt (prefix :)
set -g mode-keys vi
set -g status-keys vi

# Closing a window renumbers the ones after it, so there is never a gap in the tabs
set -g renumber-windows on

# Ctrl-PageUp / Ctrl-PageDown move between tabs, no prefix, the same keys GNOME Terminal uses
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

# A new tab (prefix c) starts in the directory the current one is in, as a terminal tab does
bind c new-window -c "#{pane_current_path}"

# Esc reaches nvim after 10ms instead of the 500ms tmux 3.4 waits for an escape sequence
set -s escape-time 10

# True color for nvim, and the terminfo entry that knows what tmux itself supports
set -g default-terminal tmux-256color
set -as terminal-features ",*:RGB"

# Click a tab to switch, wheel to scroll back, drag a pane border to resize
set -g mouse on

# 50000 lines of scrollback per pane, up from 2000
set -g history-limit 50000

# Tabs along the top, where a browser puts them
set -g status-position top

# Split with the key that looks like the crease: - draws a vertical one (panes side by side),
# _ a horizontal one (stacked). Both start in the current directory. - used to delete the
# newest paste buffer.
bind - split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
